name: Build Runner Image

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        type: string

jobs:
  build-image:
    runs-on: blacksmith-4vcpu-ubuntu-2404

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - uses: DeterminateSystems/determinate-nix-action@v3

      - name: Build image
        run: |
          nix build .#buildkit-runner-rootfs --out-link result-rootfs
          nix build .#buildkit-runner-vmlinux --out-link result-kernel

          mkdir -p dist
          cp -L result-rootfs/rootfs.img dist/rootfs.ext4
          cp -L result-kernel/vmlinux dist/vmlinux

          test -f dist/rootfs.ext4
          test -f dist/vmlinux

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: BuildKit Runner ${{ inputs.release_tag }}
          generate_release_notes: true
          files: |
            dist/rootfs.ext4
            dist/vmlinux
